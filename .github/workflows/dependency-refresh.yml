name: Compatible dependency refresh check

on:
  push:
    branches:
      - maintenance/refresh-compatible-dependencies
    paths:
      - '.github/workflows/dependency-refresh.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'

permissions:
  contents: read

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 5001
      JWT_SECRET: ci-only-e2e-jwt-secret-with-enough-length-123456
      MONGO_URI: mongodb://localhost:27017/electrovibehome_e2e?replicaSet=rs0
      E2E_API_URL: http://127.0.0.1:5001
      WOMPI_PUBLIC_KEY: pub_test_ci_e2e_only
      WOMPI_INTEGRITY_SECRET: test_integrity_ci_e2e_only
      WOMPI_EVENTS_SECRET: test_events_ci_e2e_only
      FRONTEND_URL: https://ci-preview.example.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh compatible frontend and transitive dependencies
        run: npm update --no-audit --no-fund

      - name: Refresh compatible backend and transitive dependencies
        working-directory: backend
        run: npm update --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build frontend
        run: npm run build

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Run backend unit tests
        working-directory: backend
        run: npm test

      - name: Start disposable MongoDB replica set for end-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name evh-e2e-mongodb -p 27017:27017 mongo:7.0.45 mongod --replSet rs0 --bind_ip_all

          ready=false
          for attempt in $(seq 1 30); do
            if docker exec evh-e2e-mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker logs evh-e2e-mongodb || true
            echo "Disposable MongoDB did not start."
            exit 1
          fi

          docker exec evh-e2e-mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          primary=false
          for attempt in $(seq 1 30); do
            state=$(docker exec evh-e2e-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | tr -d '\r' || true)
            if [ "$state" = "true" ]; then
              primary=true
              break
            fi
            sleep 2
          done
          if [ "$primary" != "true" ]; then
            docker logs evh-e2e-mongodb || true
            echo "Disposable MongoDB replica set did not elect a primary."
            exit 1
          fi

      - name: Start isolated API and wait for readiness
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup node server.js > "$RUNNER_TEMP/e2e-backend.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 "$E2E_API_URL/health" -o "$RUNNER_TEMP/e2e-health.json" && node -e 'const fs=require("node:fs"); const h=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(h.status!=="ok"||h.database!=="connected") process.exit(1)' "$RUNNER_TEMP/e2e-health.json"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            cat "$RUNNER_TEMP/e2e-backend.log" || true
            echo "Isolated API failed to become ready."
            exit 1
          fi

      - name: Run backend HTTP end-to-end acceptance tests
        working-directory: backend
        run: node scripts/e2e-auth-profile.js

      - name: Remove disposable MongoDB
        if: always()
        run: docker rm --force evh-e2e-mongodb || true

      - name: Upload refreshed lockfiles and manifests for review
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: compatible-dependency-refresh
          path: |
            package.json
            package-lock.json
            backend/package.json
            backend/package-lock.json
          if-no-files-found: error
          retention-days: 3
