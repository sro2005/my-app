name: Remove legacy localhost TLS files from stable history only

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PURGE_STABLE_HISTORY only after pausing Render auto-deploy and temporarily disabling the GitHub non-fast-forward rule."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: purge-stable-localhost-tls-history
  cancel-in-progress: false

jobs:
  purge-stable-only:
    if: ${{ inputs.confirmation == 'PURGE_STABLE_HISTORY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          ref: electrovibehome-stable
          fetch-depth: 0
          persist-credentials: false

      - name: Record original refs and prepare stable branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote remove origin 2>/dev/null || true
          git remote add purge-origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch purge-origin --prune --tags '+refs/heads/*:refs/remotes/purge-origin/*'

          # Store the original main ref so the workflow can prove it did not move.
          git rev-parse refs/remotes/purge-origin/main > "$RUNNER_TEMP/main-sha-before"
          git branch --force electrovibehome-stable refs/remotes/purge-origin/electrovibehome-stable
          git switch electrovibehome-stable
          echo "main before cleanup: $(cat "$RUNNER_TEMP/main-sha-before")"
          echo "stable before cleanup: $(git rev-parse electrovibehome-stable)"
          echo "Tags are intentionally left unchanged."

      - name: Install pinned git-filter-repo release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/newren/git-filter-repo/v2.47.0/git-filter-repo -o "$RUNNER_TEMP/git-filter-repo"
          sudo install -m 0755 "$RUNNER_TEMP/git-filter-repo" /usr/local/bin/git-filter-repo
          git filter-repo --version

      - name: Remove localhost TLS files only from stable history
        shell: bash
        run: |
          set -euo pipefail
          git remote remove purge-origin

          # Critical: --refs limits rewritten refs to the working branch. Do not add
          # main or tags here; their names and commit IDs are intentionally preserved.
          git filter-repo --sensitive-data-removal --force \
            --refs refs/heads/electrovibehome-stable \
            --path localhost-key.pem \
            --path localhost.pem \
            --path backend/localhost-key.pem \
            --path backend/localhost.pem \
            --invert-paths

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch electrovibehome-stable

      - name: Record stable-only cleanup in the release checklist
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("docs/RELEASE-CHECKLIST.md")
          content = path.read_text(encoding="utf-8")
          lines = []
          for line in content.splitlines():
              if line.startswith("- [!] Escaneo Gitleaks de todo el historial (582 commits"):
                  line = "- [x] Se identificó que las dos alertas Gitleaks originales provenían de certificados TLS locales en el historial compartido con `main`. La limpieza se limita intencionadamente a `electrovibehome-stable`; `main` y las etiquetas no se reescriben."
              elif line.startswith("- [!] El escaneo de historial [falló por dos detecciones"):
                  line = "- [x] El escaneo histórico inicial detectó dos copias del certificado privado local en el commit legado. El procedimiento nuevo sanea solo el historial de `electrovibehome-stable`; `main` conserva su historia original."
              elif line.startswith("- [ ] Remediar las claves históricas."):
                  line = "- [x] Se retiraron los cuatro paths de certificados locales de los commits alcanzables por `electrovibehome-stable`. `main` y las etiquetas se dejaron intactos de forma deliberada; los SHA de la rama estable cambian y deja de compartir historial con `main`."
              lines.append(line)

          content = "\n".join(lines).rstrip() + "\n"
          content += (
              "\n## Limpieza limitada a la rama estable — 27 de octubre de 2026\n\n"
              "- El saneamiento reescribe solo `electrovibehome-stable`; no mueve el ref `main` ni modifica sus commits. Las etiquetas tampoco se reescriben.\n"
              "- Se eliminan del historial de la rama estable `localhost-key.pem`, `localhost.pem`, `backend/localhost-key.pem` y `backend/localhost.pem`.\n"
              "- Como esos ficheros existían en un antepasado compartido, los SHA históricos de la rama estable cambian y su historial deja de tener un antepasado común con `main`. El árbol de archivos actual de la aplicación estable se conserva. Esto puede afectar comparaciones o futuras PR entre ambas ramas.\n"
              "- La verificación Gitleaks se limita al historial alcanzable de `electrovibehome-stable`; el historial de `main` permanece deliberadamente sin cambios.\n"
              "- [ ] Volver a habilitar el ruleset de GitHub y el auto-deploy de Render después de verificar los resultados.\n"
          )
          path.write_text(content, encoding="utf-8")
          PY
          git add docs/RELEASE-CHECKLIST.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: record stable-only TLS history cleanup [skip render]"
          fi
          git commit --allow-empty -m "security: purge legacy localhost TLS files from stable history [skip render]"

      - name: Verify stable history and current files are clean
        shell: bash
        run: |
          set -euo pipefail
          if git log electrovibehome-stable --format= --name-only -- localhost-key.pem localhost.pem backend/localhost-key.pem backend/localhost.pem | grep -E '(^|/)(localhost-key\.pem|localhost\.pem)$'; then
            echo "::error::A legacy TLS path remains in stable history."
            exit 1
          fi
          if git ls-tree -r --name-only electrovibehome-stable | grep -E '(^|/)(localhost-key\.pem|localhost\.pem)$'; then
            echo "::error::The stable branch tip still contains a legacy TLS file."
            exit 1
          fi
          echo "Stable branch history no longer contains the legacy certificate paths."

      - name: Run Gitleaks against stable history only
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            detect --source /repo --log-opts="electrovibehome-stable" --redact

      - name: Push only electrovibehome-stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add purge-origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force purge-origin refs/heads/electrovibehome-stable:refs/heads/electrovibehome-stable

          main_after="$(git ls-remote purge-origin refs/heads/main | awk '{print $1}')"
          main_before="$(cat "$RUNNER_TEMP/main-sha-before")"
          if [ "$main_after" != "$main_before" ]; then
            echo "::error::Unexpected main ref change. Stop and investigate immediately."
            exit 1
          fi
          echo "Verified: main remains at $main_after"

      - name: Summarize stable-only cleanup and follow-up
        if: success()
        shell: bash
        run: |
          {
            echo "## Stable-only historical cleanup completed"
            echo
            echo "- Only `electrovibehome-stable` was force-pushed."
            echo "- `main` was verified unchanged; tags were not rewritten."
            echo "- Stable commit IDs changed and the two branches no longer share a common historical ancestor."
            echo "- Re-enable the GitHub ruleset `Protección de Ramas` manually."
            echo "- Re-enable auto-deploy for the stable Render frontend and API after confirming no deployment started."
          } >> "$GITHUB_STEP_SUMMARY"
