name: ElectroVibeHome CI

on:
  # Ejecutar CI automáticamente en la rama de vista previa; main y el sitio publicado permanecen separados.
  push:
    branches:
      - preview/electrovibehome-v2
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/dependency-refresh.yml'
      - 'src/**'
      - 'public/**'
      - 'backend/**'
      - 'data/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'index.html'
  # También se conserva la opción manual.
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact frontend dependencies from lockfile
        run: npm ci --no-audit
      - name: Capture frontend dependency audit
        run: npm audit --json > npm-audit-frontend.json || true
      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dependency-audit
          path: npm-audit-frontend.json
          if-no-files-found: warn
          retention-days: 14
      - run: CI=true npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install exact backend dependencies from lockfile
        run: npm ci --no-audit
      - name: Capture backend dependency audit
        run: npm audit --json > npm-audit-backend.json || true
      - name: Upload backend audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-dependency-audit
          path: backend/npm-audit-backend.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run backend unit tests
        run: npm test

  smoke-preview:
    if: github.ref == 'refs/heads/preview/electrovibehome-v2'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for API health and database readiness
        env:
          API_URL: https://electrovibehome-v2-api.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$API_URL/health" -o /tmp/health.json \
              && node -e 'const h = require("/tmp/health.json"); if (h.status !== "ok" || h.database !== "connected") process.exit(1)'; then
              echo "API health and MongoDB readiness passed."
              ready=true
              break
            fi
            echo "API not ready yet (attempt $attempt/30); retrying."
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "API did not become healthy within the retry window."
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

      - name: Verify published frontend, API CORS, and demo catalog
        env:
          API_URL: https://electrovibehome-v2-api.onrender.com
          FRONTEND_URL: https://electrovibehome-v2-preview.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$FRONTEND_URL/" -o /tmp/frontend.html
          grep -Fq 'id="root"' /tmp/frontend.html

          asset=$(grep -oE 'src="[^"]+\.js"' /tmp/frontend.html | head -n 1 | cut -d '"' -f 2)
          if [ -z "$asset" ]; then
            echo "Could not find the compiled frontend JavaScript asset."
            exit 1
          fi
          case "$asset" in
            http://*|https://*) asset_url="$asset" ;;
            /*) asset_url="$FRONTEND_URL$asset" ;;
            *) asset_url="$FRONTEND_URL/$asset" ;;
          esac
          curl --fail --silent --show-error --max-time 20 "$asset_url" -o /tmp/frontend.js
          if ! grep -Fq "$API_URL" /tmp/frontend.js; then
            echo "The built frontend bundle does not contain the configured preview API URL."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 20 \
            -D /tmp/products.headers \
            -H "Origin: $FRONTEND_URL" \
            "$API_URL/api/products" -o /tmp/products.json
          if ! grep -Fiq "access-control-allow-origin: $FRONTEND_URL" /tmp/products.headers; then
            echo "The API did not allow the published preview origin through CORS."
            cat /tmp/products.headers
            exit 1
          fi


          # Verify protected routes fail closed without a bearer token.
          check_status() {
            expected="$1"; shift
            actual=$(curl --silent --show-error --max-time 20 -o /tmp/protected-response.json -w '%{http_code}' "$@")
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected, received HTTP $actual for $*"
              cat /tmp/protected-response.json 2>/dev/null || true
              exit 1
            fi
          }
          check_status 401 "$API_URL/api/customers/profile"
          check_status 401 -H 'Authorization: Bearer invalid-preview-test-token' "$API_URL/api/customers/profile"
          check_status 401 "$API_URL/api/orders/my-orders"
          check_status 401 "$API_URL/api/orders/all"
          check_status 401 -X POST -H 'Content-Type: application/json' -d '{}' "$API_URL/api/orders/realizar"
          check_status 401 -X POST -H 'Content-Type: application/json' -d '{}' "$API_URL/api/products/agregar"
          check_status 400 -X POST -H 'Content-Type: application/json' -d '{}' "$API_URL/api/auth/register"
          check_status 400 -X POST -H 'Content-Type: application/json' -d '{}' "$API_URL/api/auth/login"
          check_status 401 -X PUT -H 'Content-Type: application/json' -d '{"firstName":"Unauthorized"}' "$API_URL/api/customers/507f1f77bcf86cd799439011"
          echo "Protected routes deny missing/invalid authentication; malformed login and registration requests are rejected."

          # An unapproved origin must not receive CORS permission; security headers must remain enabled.
          curl --fail --silent --show-error --max-time 20 \
            -D /tmp/unapproved-origin.headers \
            -H 'Origin: https://unapproved-origin.invalid' \
            "$API_URL/health" -o /tmp/unapproved-origin.json
          if grep -Eiq '^access-control-allow-origin:' /tmp/unapproved-origin.headers; then
            echo "The API unexpectedly granted CORS access to an unapproved origin."
            cat /tmp/unapproved-origin.headers
            exit 1
          fi
          if ! grep -Eiq '^x-content-type-options: nosniff' /tmp/unapproved-origin.headers; then
            echo "The API is missing the expected X-Content-Type-Options security header."
            cat /tmp/unapproved-origin.headers
            exit 1
          fi
          echo "Unapproved origin was not granted CORS access; baseline Helmet security header is present."

          node <<'NODE'
          const fs = require('node:fs');
          const products = JSON.parse(fs.readFileSync('/tmp/products.json', 'utf8'));
          if (!Array.isArray(products)) throw new Error('The product endpoint did not return an array.');
          if (products.length < 66) throw new Error(`Expected at least 66 demo products; received ${products.length}.`);
          const categories = new Map();
          const names = new Set();
          for (const product of products) {
            if (product.demo !== true) throw new Error(`Product ${product.name} is not marked as demo data.`);
            if (!(Number(product.price) > 0)) throw new Error(`Invalid demo price for ${product.name}.`);
            if (!(Number(product.quantity) > 0)) throw new Error(`No demo stock for ${product.name}.`);
            const uniqueKey = `${product.category}::${product.name}`;
            if (names.has(uniqueKey)) throw new Error(`Duplicate demo product: ${uniqueKey}`);
            names.add(uniqueKey);
            categories.set(product.category, (categories.get(product.category) || 0) + 1);
          }
          if (categories.size !== 22) throw new Error(`Expected 22 categories; received ${categories.size}.`);
          for (const [category, count] of categories) {
            if (count < 3) throw new Error(`Category ${category} has only ${count} product(s).`);
          }
          console.log(`Live smoke test passed: ${products.length} sample products in ${categories.size} categories; all are marked as demo, have positive price/stock, and have no duplicate names.`);
          NODE

