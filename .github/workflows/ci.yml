name: ElectroVibeHome CI

on:
  # Ejecutar CI en la rama estable oficial.
  push:
    branches:
      - electrovibehome-stable
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/dependency-refresh.yml'
      - '.github/dependabot.yml'
      - 'src/**'
      - 'public/**'
      - 'backend/**'
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'index.html'
  # Los PR, incluidos los de Dependabot, ejecutan pruebas y auditorías antes de fusionar.
  pull_request:
    branches:
      - electrovibehome-stable
    paths:
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
      - 'src/**'
      - 'public/**'
      - 'backend/**'
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'index.html'
  # También se conserva la opción manual.
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact frontend dependencies from lockfile
        run: npm ci --no-audit
      - name: Capture frontend dependency audit
        run: npm audit --json > npm-audit-frontend.json || true
      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dependency-audit
          path: npm-audit-frontend.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce frontend dependency audit (high and critical)
        run: npm audit --audit-level=high
      - run: CI=true npm test
      - run: npm run build
      - name: Upload all compiled frontend JavaScript chunks for live verification
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-assets
          path: build/assets/*.js
          if-no-files-found: error
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install exact backend dependencies from lockfile
        run: npm ci --no-audit
      - name: Capture backend dependency audit
        run: npm audit --json > npm-audit-backend.json || true
      - name: Upload backend audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-dependency-audit
          path: backend/npm-audit-backend.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce backend dependency audit (high and critical)
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run backend unit tests
        run: npm test

  backend-e2e:
    needs: [backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 5001
      JWT_SECRET: ci-only-e2e-jwt-secret-with-enough-length-123456
      MONGO_URI: mongodb://localhost:27017/electrovibehome_e2e?replicaSet=rs0
      E2E_API_URL: http://127.0.0.1:5001
      WOMPI_PUBLIC_KEY: pub_test_ci_e2e_only
      WOMPI_INTEGRITY_SECRET: test_integrity_ci_e2e_only
      WOMPI_EVENTS_SECRET: test_events_ci_e2e_only
      FRONTEND_URL: https://ci-preview.example.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit
      - name: Start disposable MongoDB replica set for transactional tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name evh-e2e-mongodb -p 27017:27017 mongo:7.0.45 mongod --replSet rs0 --bind_ip_all

          ready=false
          for attempt in $(seq 1 30); do
            if docker exec evh-e2e-mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker logs evh-e2e-mongodb || true
            echo "Disposable MongoDB did not start."
            exit 1
          fi

          docker exec evh-e2e-mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          primary=false
          for attempt in $(seq 1 30); do
            state=$(docker exec evh-e2e-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | tr -d '\r' || true)
            if [ "$state" = "true" ]; then
              primary=true
              break
            fi
            sleep 2
          done
          if [ "$primary" != "true" ]; then
            docker logs evh-e2e-mongodb || true
            echo "Disposable MongoDB replica set did not elect a primary."
            exit 1
          fi
          echo "Disposable MongoDB replica set is ready for transactions."
      - name: Start isolated backend and wait for MongoDB readiness
        shell: bash
        run: |
          set -euo pipefail
          nohup node server.js > "$RUNNER_TEMP/e2e-backend.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 "$E2E_API_URL/health" -o "$RUNNER_TEMP/e2e-health.json" && node -e 'const fs=require("node:fs"); const h=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(h.status!=="ok"||h.database!=="connected") process.exit(1)' "$RUNNER_TEMP/e2e-health.json"; then
              echo "Isolated API and disposable MongoDB are ready."
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Isolated API failed to become ready."
            cat "$RUNNER_TEMP/e2e-backend.log" || true
            exit 1
          fi
      - name: Run HTTP end-to-end test against isolated MongoDB
        run: node scripts/e2e-auth-profile.js
      - name: Stop disposable MongoDB
        if: always()
        run: docker rm --force evh-e2e-mongodb || true

  smoke-preview:
    if: github.ref == 'refs/heads/electrovibehome-stable'
    needs: [frontend, backend, backend-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled frontend JavaScript chunks
        uses: actions/download-artifact@v7
        with:
          name: frontend-build-assets
          path: frontend-build-assets
      - name: Wait for API health and database readiness
        env:
          API_URL: https://electrovibehome-v2-api.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$API_URL/health" -o /tmp/health.json \
              && node -e 'const h = require("/tmp/health.json"); if (h.status !== "ok" || h.database !== "connected") process.exit(1)'; then
              echo "API health and MongoDB readiness passed."
              ready=true
              break
            fi
            echo "API not ready yet (attempt $attempt/30); retrying."
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "API did not become healthy within the retry window."
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

      - name: Verify published frontend, API CORS, and demo catalog
        env:
          API_URL: https://electrovibehome-v2-api.onrender.com
          FRONTEND_URL: https://electrovibehome.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$FRONTEND_URL/" -o /tmp/frontend.html
          grep -Fq 'id="root"' /tmp/frontend.html

          # Vite splits lazy-loaded pages into separate chunks. The API base URL may
          # therefore live in a route chunk, not in the first script loaded by index.html.
          if ! grep -RFl -- "$API_URL" frontend-build-assets >/dev/null; then
            echo "No compiled frontend JavaScript chunk contains the configured API base URL."
            echo "Checked every JavaScript asset produced by the frontend build."
            exit 1
          fi
          echo "Configured API base URL found in the compiled frontend chunks."

          curl --fail --silent --show-error --max-time 20 \
            -D /tmp/products.headers \
            -H "Origin: $FRONTEND_URL" \
            "$API_URL/api/products" -o /tmp/products.json
          if ! grep -Fiq "access-control-allow-origin: $FRONTEND_URL" /tmp/products.headers; then
            echo "The API did not allow the published preview origin through CORS."
            cat /tmp/products.headers
            exit 1
          fi


          # Verify protected routes fail closed without a bearer token.
          check_status() {
            expected="$1"; shift
            actual=$(curl --silent --show-error --max-time 20 -o /tmp/protected-response.json -w '%{http_code}' "$@")
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected, received HTTP $actual for $*"
              cat /tmp/protected-response.json 2>/dev/null || true
              exit 1
            fi
          }
          check_status 401 "$API_URL/api/customers/profile"
          check_status 401 -H 'Authorization: Bearer invalid-preview-test-token' "$API_URL/api/customers/profile"
          check_status 401 "$API_URL/api/orders/my-orders"
          check_status 401 "$API_URL/api/orders/all"
          check_status 401 -X POST -H 'Content-Type: application/json' -d '{}' "$API_URL/api/orders/realizar"
          check_status 401 -X POST -H 'Content-Type: application/json' -d '{}' "$API_URL/api/products/agregar"
          check_status 400 -X POST -H 'Content-Type: application/json' -d '{}' "$API_URL/api/auth/register"
          check_status 400 -X POST -H 'Content-Type: application/json' -d '{}' "$API_URL/api/auth/login"
          check_status 401 -X PUT -H 'Content-Type: application/json' -d '{"firstName":"Unauthorized"}' "$API_URL/api/customers/507f1f77bcf86cd799439011"
          echo "Protected routes deny missing/invalid authentication; malformed login and registration requests are rejected."

          # An unapproved origin must not receive CORS permission; security headers must remain enabled.
          curl --fail --silent --show-error --max-time 20 \
            -D /tmp/unapproved-origin.headers \
            -H 'Origin: https://unapproved-origin.invalid' \
            "$API_URL/health" -o /tmp/unapproved-origin.json
          if grep -Eiq '^access-control-allow-origin:' /tmp/unapproved-origin.headers; then
            echo "The API unexpectedly granted CORS access to an unapproved origin."
            cat /tmp/unapproved-origin.headers
            exit 1
          fi
          if ! grep -Eiq '^x-content-type-options: nosniff' /tmp/unapproved-origin.headers; then
            echo "The API is missing the expected X-Content-Type-Options security header."
            cat /tmp/unapproved-origin.headers
            exit 1
          fi
          echo "Unapproved origin was not granted CORS access; baseline Helmet security header is present."

          node <<'NODE'
          const fs = require('node:fs');
          const products = JSON.parse(fs.readFileSync('/tmp/products.json', 'utf8'));
          if (!Array.isArray(products)) throw new Error('The product endpoint did not return an array.');
          if (products.length < 66) throw new Error(`Expected at least 66 demo products; received ${products.length}.`);
          const categories = new Map();
          const names = new Set();
          for (const product of products) {
            if (product.demo !== true) throw new Error(`Product ${product.name} is not marked as demo data.`);
            if (!(Number(product.price) > 0)) throw new Error(`Invalid demo price for ${product.name}.`);
            if (!(Number(product.quantity) > 0)) throw new Error(`No demo stock for ${product.name}.`);
            const uniqueKey = `${product.category}::${product.name}`;
            if (names.has(uniqueKey)) throw new Error(`Duplicate demo product: ${uniqueKey}`);
            names.add(uniqueKey);
            categories.set(product.category, (categories.get(product.category) || 0) + 1);
          }
          if (categories.size !== 22) throw new Error(`Expected 22 categories; received ${categories.size}.`);
          for (const [category, count] of categories) {
            if (count < 3) throw new Error(`Category ${category} has only ${count} product(s).`);
          }
          console.log(`Live smoke test passed: ${products.length} sample products in ${categories.size} categories; all are marked as demo, have positive price/stock, and have no duplicate names.`);
          NODE

  frontend-browser:
    if: github.ref == 'refs/heads/electrovibehome-stable'
    needs: [smoke-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit
      - name: Install pinned Playwright browser runner
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check live preview at desktop, tablet and mobile widths
        env:
          FRONTEND_URL: https://electrovibehome.onrender.com
        run: node scripts/frontend-browser-smoke.cjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-responsive-screenshots
          path: artifacts/frontend-browser/
          if-no-files-found: warn
          retention-days: 14
