name: Release security verification

on:
  push:
    branches:
      - electrovibehome-stable
    paths:
      - '.github/workflows/secret-history-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-history-scan:
    name: Scan full Git history for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out every branch and tag history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks against all reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$RUNNER_TEMP/gitleaks:/report" \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            detect --source /repo --log-opts="--all" --redact \
            --report-format json --report-path /report/gitleaks.json
          rc=$?
          set -e
          if [ ! -f "$RUNNER_TEMP/gitleaks/gitleaks.json" ]; then
            echo "Gitleaks did not produce a report; treating scan as inconclusive."
            exit 2
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/gitleaks/gitleaks.json', 'utf8'));
          console.log('Gitleaks finding count:', report.length);
          for (const finding of report) {
            console.log([
              'rule=' + (finding.RuleID || 'unknown'),
              'file=' + (finding.File || 'unknown'),
              'commit=' + (finding.Commit || 'unknown')
            ].join(' | '));
          }
          NODE
          exit "$rc"

      - name: Preserve redacted scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-history-report
          path: ${{ runner.temp }}/gitleaks/gitleaks.json
          if-no-files-found: warn
          retention-days: 14

  live-authenticated-acceptance:
    name: Verify real published customer authentication
    if: github.event_name == 'push' && github.ref == 'refs/heads/electrovibehome-stable'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the published API and MongoDB to wake up
        shell: bash
        env:
          API_URL: https://electrovibehome-v2-api.onrender.com
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$API_URL/health" -o "$RUNNER_TEMP/live-health.json" \
              && node -e 'const fs=require("node:fs"); const h=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(h.status!=="ok"||h.database!=="connected") process.exit(1)' "$RUNNER_TEMP/live-health.json"; then
              echo "Published API and MongoDB are ready."
              ready=true
              break
            fi
            echo "API not ready yet (attempt $attempt/30); waiting for cold start."
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "API did not become healthy within the retry window."
            cat "$RUNNER_TEMP/live-health.json" 2>/dev/null || true
            exit 1
          fi

      - name: Register an isolated disposable QA customer and verify real API authorization
        shell: bash
        env:
          API_URL: https://electrovibehome-v2-api.onrender.com
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');

          const base = process.env.API_URL.replace(/\/$/, '');
          const runId = process.env.GITHUB_RUN_ID;
          const attempt = process.env.GITHUB_RUN_ATTEMPT;
          const email = `evh-qa-live-${runId}-${attempt}@example.invalid`;
          const suffix = Number(String(runId).slice(-6)) % 899999999;
          const idDigits = String(100000000 + suffix);
          const identificationNumber = idDigits.replace(/(\d{3})(\d{3})(\d{3})/, '$1.$2.$3');
          const password = `EvH-QA-${runId}-Secure!`;

          async function call(path, { method = 'GET', body, token } = {}) {
            const response = await fetch(base + path, {
              method,
              headers: {
                ...(body ? { 'Content-Type': 'application/json' } : {}),
                ...(token ? { Authorization: 'Bearer ' + token } : {})
              },
              ...(body ? { body: JSON.stringify(body) } : {})
            });
            const text = await response.text();
            let payload = null;
            try { payload = text ? JSON.parse(text) : null; } catch {}
            return { status: response.status, payload };
          }

          (async () => {
            const health = await call('/health');
            assert.equal(health.status, 200, 'Published backend health endpoint must return HTTP 200.');
            assert.equal(health.payload?.status, 'ok', 'Published backend health must report status=ok.');
            assert.equal(health.payload?.database, 'connected', 'Published backend database must be connected.');

            const registration = await call('/api/auth/register', {
              method: 'POST',
              body: {
                firstName: 'QA Automática',
                lastName: 'Cuenta Temporal',
                email,
                identificationNumber,
                birthDate: '2000-01-06',
                phone: '3001234567',
                preferences: [],
                password
              }
            });
            assert.equal(registration.status, 201, 'Live customer registration must return HTTP 201; received ' + registration.status);

            const login = await call('/api/auth/login', {
              method: 'POST',
              body: { email, password, role: 'user' }
            });
            assert.equal(login.status, 200, 'Live customer login must return HTTP 200; received ' + login.status);
            const token = login.payload?.token;
            assert.ok(typeof token === 'string' && token.length > 20, 'Login must return a usable bearer token.');
            assert.equal(login.payload?.user?.role, 'user', 'Public registration/login must retain customer role.');
            for (const sensitive of ['password', 'resetPasswordToken', 'resetPasswordExpires']) {
              assert.equal(Object.prototype.hasOwnProperty.call(login.payload.user || {}, sensitive), false,
                'Login response must not expose ' + sensitive + '.');
            }

            const profile = await call('/api/customers/profile', { token });
            assert.equal(profile.status, 200, 'Authenticated live profile endpoint must return HTTP 200.');
            assert.equal(String(profile.payload?._id), String(login.payload?.user?._id),
              'Profile endpoint must return the signed-in customer.');
            assert.equal(profile.payload?.email, email, 'Profile endpoint must return the signed-in email.');
            for (const sensitive of ['password', 'resetPasswordToken', 'resetPasswordExpires']) {
              assert.equal(Object.prototype.hasOwnProperty.call(profile.payload || {}, sensitive), false,
                'Profile response must not expose ' + sensitive + '.');
            }

            const adminCustomers = await call('/api/customers/all', { token });
            assert.ok([401, 403].includes(adminCustomers.status),
              'Customer token must not access admin customer directory; received ' + adminCustomers.status);
            const adminOrders = await call('/api/orders/all', { token });
            assert.ok([401, 403].includes(adminOrders.status),
              'Customer token must not access admin order directory; received ' + adminOrders.status);
            const myOrders = await call('/api/orders/my-orders', { token });
            assert.equal(myOrders.status, 200, 'Customer should be able to load their own order history.');
            assert.ok(Array.isArray(myOrders.payload), 'Customer order history must return an array.');
            assert.equal(myOrders.payload.length, 0, 'Fresh QA customer must have no orders.');

            console.log(JSON.stringify({
              result: 'PASS',
              liveHealth: health.status,
              registration: registration.status,
              login: login.status,
              profile: profile.status,
              adminCustomerDirectory: adminCustomers.status,
              adminOrderDirectory: adminOrders.status,
              ownOrderHistory: myOrders.status,
              syntheticTestAccount: email,
              purchasesCreated: 0,
              paymentRequestsSent: 0
            }, null, 2));
          })().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
